  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6>Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="Ejemplo: Pizza" id="title" type="text" class="validate" required>
        <label for="title">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="Ejemplo: Queso, masa, pepperoni" id="ingredients" type="text" class="validate" required>
        <label for="ingredients">Ingredientes</label>
      </div>
        <div class="input-field">
          <input placeholder="Ejemplo: 150" id="precio" type="number" class="validate" required>
          <label for="precio">Precio</label>
      </div>
      <div class="input-field center">
        <button type="submit" class="btn-small">Agregar</button>
      </div>
    </form>
  </div>
