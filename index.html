<body class="grey darken-4"> 
  
  <header>
    <nav class="z-depth-0 grey darken-4">
      <div class="nav-wrapper container">
        <a href="/" class="brand-logo">FastFood</a>
        <span class="right grey-text text-lighten-2"> 
          <i class="material-icons sidenav-trigger" data-target="side-menu" role="button" aria-label="Abrir menú lateral">menu</i>
        </span>
      </div>
    </nav>
  </header>

  <aside>
    <ul id="side-menu" class="sidenav side-menu grey darken-4">
      <li><a class="subheader grey-text text-lighten-1">FastFood</a></li>
      <li><a href="./pages/about.html" class="waves-effect white-text">Acerca</a></li>
      <li><a href="./pages/pedidos.html" class="waves-effect white-text">Generar pedido</a></li>
      <li><div class="divider grey darken-3"></div></li>
      <li>
        <a href="./pages/contact.html" class="waves-effect white-text">
          <i class="material-icons white-text">mail_outline</i>Contacto
        </a>
      </li>
    </ul>
  </aside>

  <main class="recipes container grey-text text-lighten-2"></main>

  <div class="center" style="margin-top: 2rem;">
    <a class="btn-floating btn-large waves-effect waves-light red accent-2 sidenav-trigger" data-target="side-form" aria-label="Añadir nuevo platillo">
      <i class="material-icons">add</i>
    </a>
  </div>

  <aside id="side-form" class="sidenav side-form grey darken-4 grey-text text-lighten-2">
    <form class="add-recipe container section" novalidate>
      <h6 class="white-text">Nuevo platillo</h6>
      <div class="divider grey darken-3"></div>
      
      <div class="input-field">
        <input placeholder="Ejemplo: Pizza" id="title" type="text" class="validate white-text" required aria-required="true">
        <label for="title">Nombre</label>
      </div>
      
      <div class="input-field">
        <input placeholder="Ejemplo: Queso, masa, pepperoni" id="ingredients" type="text" class="validate white-text" required aria-required="true">
        <label for="ingredients">Ingredientes</label>
      </div>
      
      <div class="input-field">
        <input placeholder="Ejemplo: 150" id="precio" type="number" class="validate white-text" required aria-required="true">
        <label for="precio">Precio</label>
      </div>

      <!-- Módulo de UI de la Cámara -->
      <div class="section">
        <p class="grey-text text-darken-1">Fotografía del platillo:</p>
        
        <div class="input-field center">
          <button type="button" id="btnIniciarCamara" class="btn-small waves-effect waves-light blue">
            <i class="material-icons left">camera_alt</i> Activar Cámara
          </button>
        </div>

        <div id="camara" class="camera-container" style="display: none;">
          <!-- playsinline es vital para que funcione en iOS sin abrir el reproductor a pantalla completa -->
          <video id="video" class="camera-feed" autoplay playsinline>Cámara no disponible</video>
          
          <div class="center" style="padding: 10px;">
            <button type="button" id="btnFoto" class="btn-floating btn-large waves-effect waves-light red">
              <i class="material-icons">camera</i>
            </button>
          </div>
        </div>
        
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div id="salida" class="center">
          <img id="foto" src="" alt="Vista previa del platillo" class="responsive-img photo-preview" style="display:none;">
        </div>

        <!-- Campo oculto para almacenar el payload de la imagen en Base64 -->
        <input type="hidden" id="imagen-base64">
      </div>

      <div class="input-field center" style="margin-top: 2rem;">
        <button type="submit" class="btn-large waves-effect waves-light red accent-2">Agregar Platillo</button>
      </div>
    </form>
  </aside>

  <script type="module" src="js/index.js" defer></script>
  <script type="module" src="js/db.js" defer></script>
  <script>
    if(typeof navigator.serviceWorker !== 'undefined') {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker registrado', reg))
        .catch(err => console.error('Error al registrar el Service Worker', err));
    }
  </script>
  
</body>
</html>
