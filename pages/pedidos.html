<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Generar Pedido - FastFood</title>
  
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js" defer></script>
</head>
<body class="grey darken-4">

  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">FastFood</a>
      <span class="right grey-text text-lighten-2">
        <i class="material-icons sidenav-trigger" data-target="side-menu" role="button" aria-label="Abrir menú">menu</i>
      </span>
    </div>
  </nav>

  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">FastFood</a></li>
    <li><a href="/" class="waves-effect">Inicio</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">Generar pedido</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect"><i class="material-icons">mail_outline</i>Contacto</a></li>
  </ul>

  <div class="container grey-text text-lighten-2">
    <form class="add-order container section">
      <h6>Detalles de tu Pedido</h6>
      <div class="divider"></div>
      
      <div class="input-field">
        <input placeholder="Ejemplo: Juan Pérez" id="cliente-nombre" type="text" class="validate" required>
        <label for="cliente-nombre">Nombre completo</label>
      </div>

      <div class="input-field">
        <input placeholder="Ejemplo: Av. Siempre Viva 123" id="cliente-direccion" type="text" class="validate" required>
        <label for="cliente-direccion">Dirección de entrega</label>
      </div>

      <div class="input-field">
        <select id="dish-selector" name="platillo_seleccionado" required>
          <option value="" disabled selected>Cargando menú...</option>
        </select>
        <label for="dish-selector">Selecciona un platillo</label>
      </div>

      <div class="input-field">
        <input placeholder="Ejemplo: 2" id="cantidad" type="number" class="validate" min="1" required>
        <label for="cantidad">Cantidad</label>
      </div>

      <div class="input-field center">
        <button type="submit" class="btn-small">Procesar Pedido</button>
      </div>
    </form> 
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3zhixRvn3XictflC58KNHLT2K3yWb0d4",
      authDomain: "fastfood-6a333.firebaseapp.com",
      projectId: "fastfood-6a333",
      storageBucket: "fastfood-6a333.firebasestorage.app",
      messagingSenderId: "443865980845",
      appId: "1:443865980845:web:24afdf0408d9ab41064b24"
    };

    const app = initializeApp(firebaseConfig);
    window.db = getFirestore(app);
  </script>

  <script type="module" src="/js/index.js" defer></script>
  <script type="module" src="/js/db.js" defer></script>
  
</body>

</html>
